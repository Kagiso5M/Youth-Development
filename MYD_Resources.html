  <style>
  .thumbnail-container {
	/* Flexbox handles the layout, alignment, and wrapping automatically */
	display: flex;
	flex-wrap: wrap;
	justify-content: left-side;
	align-items: center;
	gap: 20px; /* Space between thumbnails */
	padding: 20px;
	max-width: 1200px;
	margin: 0 auto; /* Centers the whole container on the page */
}

.thumbnail-link {
	display: inline-block;
	transition: transform 0.2s ease-in-out;
}

/* Subtle hover effect to show it is clickable */
.thumbnail-link:hover {
	transform: scale(1.05); 
}

.thumbnail-img {
	width: 150px; /* Adjust size as needed */
	height: 150px; /* Keep it uniform */
	object-fit: cover; /* Prevents distortion if images are different sizes */
	border-radius: 8px; /* Smooths the corners */
	box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
</style>
<style>
    /* Remove the navbar's default margin-bottom and rounded borders */ 
    .navbar {
      margin-bottom: 0;
      border-radius: 0;
    }
    
    /* Set height of the grid so .sidenav can be 100% (adjust as needed) */
    .row.content {height: 450px}
    
    /* Set gray background color and 100% height */
    .sidenav {
      padding-top: 20px;
      background-color: #f1f1f1;
      height: 100%;
    }
    
    /* Set black background color, white text and some padding */
    footer {
      background-color: #555;
      color: white;
      padding: 15px;
    }
    
    /* On small screens, set height to 'auto' for sidenav and grid */
    @media screen and (max-width: 767px) {
      .sidenav {
        height: auto;
        padding: 15px;
      }
      .row.content {height:auto;} 
    }
  </style>
</head>
